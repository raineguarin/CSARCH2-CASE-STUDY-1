<!DOCTYPE html>
<html lang ="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Way BSA LRU vs MRU</title>
    <style>
        body{
            background-color: gray;
            font-family: Helvetica, sans-serif;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .config input[type="number"],
        .config select {
            border: 3px solid #555555; 
            border-radius: 12px;
            width: 200px;      
            padding: 6px 7px;           
           
            outline: none;               
            background-color: #ffffff;   
            box-sizing: border-box;  
            transition: border-color 0.2s ease, box-shadow 0.2s;
            
            text-align: center;
            font-size: 14px;
            font-family: Helvetica, sans-serif;
        }

    </style>
</head>    
<body>
    <header> 
        <h1>4-Way BSA: LRU vs MRU</h1>
    </header>

    <section class="mainUi">
        <h2>Specifications</h2>
        <p>Note:<i>Main Memory size is fixed at 1024 blocks</i></p>
        <div class="config">
            <label>Block Size: <br> <input type="number" id="blockSize" value="0"></label>
            <br><br>
            <label>Number of Cache Blocks: <br> <input type="number" id="cacheBlocks" value="0"></label>
            <br><br>
            <label>Read Policy: <br> <select id="policy">
                <option value="Non-load-through">Non-Load-Through</option>
                <option value="Load-through">Load-Through</option>
            </select>
            <br><br>
            </label>
            <label> Test Cases <br>
                <select id="testCases">
                        <option value="sequential">Sequential Sequence</option>
                        <option value="mid-repeat">Mid-Repeat Sequence</option>
                        <option value="random">Random Sequence</option>
                </select>
            </label>

            <div class="Output">
                <! this is where the visual and statistical output will be placed !>
            </div>


        </div>
    </section>

</body>
</html>

        <!-- this is the test js right now pls change if wrong -->
        <script>
            const NUM_WAYS = 4;
            const MEM_BLOCKS = 1024; 
            const HIT_TIME = 1;
            const MEM_PER_WORD = 10;

        function isPowerOfTwo(n) {
            return Number.isInteger(n) && n > 0 && (n & (n - 1)) === 0;
        }


        function generateSequence(testCase, n, input) {
            const seq = [];

            const getBlock = (index) => {
                if (input && input.length > 0) {
                    return input[index % input.length];
                }
                return index;
            };

            if (testCase === 'sequential') {
                const base = [];
                for (let i = 0; i < 2 * n; i++) base.push(i);
                seq.push(...base, ...base);

            } else if (testCase === 'mid-repeat') {
                const base = [];
                for (let i = 0; i < 2 * n; i++) base.push(i);
                const halfReversed = base.slice(0, n).slice().reverse();
                const fullReversed = base.slice().reverse();
                seq.push(...base, ...base, ...halfReversed, ...fullReversed);
        
            } else if (testCase === 'random') {
                for (let i = 0; i < 64; i++) {
                    if (input && input.length > 0) {
                        seq.push(input[Math.floor(Math.random() * input.length)]);
                    } else {
                        seq.push(Math.floor(Math.random() * MEM_BLOCKS));
                    }
            }
        }

        return seq;

        }

        function createCache(numSets) {
            const sets = [];
            for (let s = 0; s < numSets; s++) {
                const ways = [];
                for (let w = 0; w < NUM_WAYS; w++) {
                    ways.push({ valid: false, tag: null, lastUsed: -1 ,block: null});
                }
                sets.push(ways);
        }
        return sets;
    }

    function runSimulation(policyType, numSets, sequence) {
            const cache = createCache(numSets);
            let hits = 0;
            let misses = 0;
            const simLog =[];

            sequence.forEach((blockAddr, step) => {
                const setIndex = blockAddr % numSets;
                const tag = Math.floor(blockAddr / numSets);
                const set = cache[setIndex];
                const hitWay = set.find(w => w.valid && w.tag === tag);
                let actLog = "";

                if (hitWay) {
                    hits++;
                    hitWay.lastUsed = step;
                    actLog = 'Hit in set ' + setIndex;
                } else {
                    misses++;
                    let targetWay = set.find(w => !w.valid);

                    if (!targetWay) {
                        if (policyType === 'LRU') {
                            targetWay = set.reduce((min, w) => w.lastUsed < min.lastUsed ? w : min, set[0]);
                        } else {
                            targetWay = set.reduce((max, w) => w.lastUsed > max.lastUsed ? w : max, set[0]);
                        }
                    actLog = 'MISS (Evicted Block ' + targetWay.block + ' from Set ' + setIndex + ')';
                    } else {
                        actLog = 'MISS (Placed in empty slot in Set ' + setIndex + ')';
                    }

                    targetWay.valid = true;
                    targetWay.tag = tag;
                    targetWay.lastUsed = step;
                    targetWay.block = blockAddr;
                }
                simLog.push('Step ' + (step + 1) + ': Access Block ' + blockAddr + ' -> ' + actLog);
            });

            return { hits, misses, total: sequence.length, finalCache: cache, simLog };
        }

        function cachTable(cache, title) {
            let html = '<h4>' + title +' - Final Memory Snapshot</h4>';
            html += `<table style="width:100%; border-collapse: collapse; margin-bottom: 20px; font-size:12px;" border="1">`;
            html += `<tr><th>Set Index</th><th>Way 0</th><th>Way 1</th><th>Way 2</th><th>Way 3</th></tr>`;
            cache.forEach((set, i) => {
                html += `<tr><td>${i}</td>`;
                set.forEach(way => {
                    html += `<td>${way.valid ? 'Blk '+way.block : 'Empty'}</td>`;
                });
                html += `</tr>`;
            });
            html += `</table>`;
            return html;
        }

        function statOutput(res, hit, missPen) {
            hitRate = (res.hits / res.total);
            missRate = (res.misses / res.total);
            totalAccessTime = (Number(res.hits) * Number(hit)) + (Number(res.misses) * Number(missPen));
            amat = totalAccessTime / res.total;

            return {
                hitRate: (hitRate * 100).toFixed(2),
                missRate: (missRate * 100).toFixed(2),
                totalTime: totalAccessTime,
                amat: amat.toFixed(2)
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            const configDiv = document.querySelector('.config');
            let outputDiv = document.querySelector('.Output') || document.querySelector('#output');

            const testCasesLabel = document.getElementById('testCases').parentNode;
            const baseSeqLabel = document.createElement('label');
            baseSeqLabel.innerHTML = 'Base Sequence Pool: <br> <input type="text" id="baseSequence" placeholder="e.g. 10, 20, 30, 40">';
            baseSeqLabel.style.display = 'block';
            baseSeqLabel.style.marginBottom = '15px';
            
            const baseSeqInput = baseSeqLabel.querySelector('input');
            baseSeqInput.style.border = '3px solid #555555';
            baseSeqInput.style.borderRadius = '12px';
            baseSeqInput.style.width = '200px';
            baseSeqInput.style.padding = '6px 7px';
            baseSeqInput.style.outline = 'none';
            baseSeqInput.style.backgroundColor = '#ffffff';
            baseSeqInput.style.boxSizing = 'border-box';
            baseSeqInput.style.textAlign = 'center';
            baseSeqInput.style.fontSize = '14px';
            baseSeqInput.style.fontFamily = 'Helvetica, sans-serif';
            baseSeqInput.style.transition = 'border-color 0.2s ease, box-shadow 0.2s';

            testCasesLabel.parentNode.insertBefore(baseSeqLabel, testCasesLabel);

            let runBtn = document.getElementById('runBtn');
            if (!runBtn) {
                runBtn = document.createElement('button');
                runBtn.id = 'runBtn';
                runBtn.innerText = 'Run Simulation';
                configDiv.insertBefore(runBtn, outputDiv);
            }

            runBtn.addEventListener('click', () => {
                const blockSize = parseInt(document.getElementById('blockSize').value, 10);
                const cacheBlocks = parseInt(document.getElementById('cacheBlocks').value, 10);
                const testCase = document.getElementById('testCases').value;
                const policy = document.getElementById('policy').value;
                const rawInput = document.getElementById('baseSequence').value;

                if (isNaN(blockSize) || !isPowerOfTwo(blockSize) || blockSize < 2) {
                    outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Block Size must be a power of 2 and at least 2.</p>`;
                    return;
                }
                if (isNaN(cacheBlocks) || !isPowerOfTwo(cacheBlocks) || cacheBlocks < 4) {
                    outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Cache Blocks must be a power of 2 and at least 4.</p>`;
                    return;
                }

                let inputBlock = [];
                if (rawInput.trim() !== '') {
                    inputBlock = rawInput.split(',').map(s => parseInt(s.trim(), 10)).filter(num => !isNaN(num));
                    if (inputBlock.length === 0) {
                        outputDiv.innerHTML = `<p style="color: #ff8888;">Please Separate Numbers with a comma</p>`;
                        return;
                    }
                }

                let missPenalty = 0;
                if (policy === 'Non-load-through') {
                    missPenalty = HIT_TIME + (blockSize * MEM_PER_WORD);
                } else {
                    missPenalty = HIT_TIME + MEM_PER_WORD; 
                }

                const numSets = cacheBlocks / NUM_WAYS;
                const sequence = generateSequence(testCase, cacheBlocks);

                const lruRes = runSimulation('LRU', numSets, sequence);
                const mruRes = runSimulation('MRU', numSets, sequence);

                const lruStats = statOutput(lruRes, missPenalty, HIT_TIME);
                const mruStats = statOutput(mruRes, missPenalty, HIT_TIME);

                let outHtml = '<div style="margin-top:20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;">';
                outHtml += '<h3>Statistical Outputs (' + sequence.length + ' Accesses)</h3>';
                outHtml += '<p style="font-size:12px; font-weight:normal;">Miss Penalty calculated at ' + missPenalty + ' cycles.</p>';
                
                outHtml += '<table style="width:100%; color:white; text-align:center; border-collapse: collapse; margin-bottom: 20px;" border="1">';
                outHtml += '<tr><th>Metric</th><th>LRU</th><th>MRU</th></tr>';
                outHtml += '<tr><td>Hits</td><td>' + lruRes.hits + '</td><td>' + mruRes.hits + '</td></tr>';
                outHtml += '<tr><td>Misses</td><td>' + lruRes.misses + '</td><td>' + mruRes.misses + '</td></tr>';
                outHtml += '<tr><td>Hit Rate</td><td>' + lruStats.hitRate + '%</td><td>' + mruStats.hitRate + '%</td></tr>';
                outHtml += '<tr><td>Miss Rate</td><td>' + lruStats.missRate + '%</td><td>' + mruStats.missRate + '%</td></tr>';
                outHtml += '<tr><td>Total Access Time</td><td>' + lruStats.totalTime + ' cycles</td><td>' + mruStats.totalTime + ' cycles</td></tr>';
                outHtml += '<tr><td>AMAT</td><td>' + lruStats.amat + ' cycles</td><td>' + mruStats.amat + ' cycles</td></tr>';
                outHtml += '</table>';

                outHtml += '<div style="display: flex; justify-content: space-between; gap: 10px;">';
                outHtml += '<div style="flex: 1;">' + cachTable(lruRes.finalCache, 'LRU') + '</div>';
                outHtml += '<div style="flex: 1;">' + cachTable(mruRes.finalCache, 'MRU') + '</div>';
                outHtml += '</div>';

                outHtml += '<h3>System Output Trace Log</h3>';
                outHtml += '<div style="display: flex; justify-content: space-between; gap: 10px;">';
                
                outHtml += '<div style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;">';
                outHtml += '<strong>LRU Trace:</strong><br>' + lruRes.simLog.join('<br>');
                outHtml += '</div>';

                outHtml += '<div style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;">';
                outHtml += '<strong>MRU Trace:</strong><br>' + mruRes.simLog.join('<br>');
                outHtml += '</div>';
                outHtml += '</div></div>';

                outputDiv.innerHTML = outHtml;
            });
        });
    </script>
</body>
</html>
