<!DOCTYPE html>
<html lang ="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Way BSA LRU vs MRU</title>
    <style>
        body{
            background-color: gray;
            font-family: Helvetica, sans-serif;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .config input[type="number"],
        .config select {
            border: 3px solid #555555; 
            border-radius: 12px;
            width: 200px;      
            padding: 6px 7px;           
           
            outline: none;               
            background-color: #ffffff;   
            box-sizing: border-box;  
            transition: border-color 0.2s ease, box-shadow 0.2s;
            
            text-align: center;
            font-size: 14px;
            font-family: Helvetica, sans-serif;
        }

    </style>
</head>    
<body>
    <header> 
        <h1>4-Way BSA: LRU vs MRU</h1>
    </header>

    <section class="mainUi">
        <h2>Specifications</h2>
        <p>Note:<i>Main Memory size is fixed at 1024 blocks</i></p>
        <div class="config">
            <label>Block Size (words): <br> <input type="number" id="blockSize" value="4"></label>
            <br><br>
            <label>Number of Cache Blocks: <br> <input type="number" id="cacheBlocks" value="16"></label>
            <br><br>
            <label>Read Policy: <br> <select id="policy">
                <option value="Non-load-through">Non-Load-Through</option>
                <option value="Load-through">Load-Through</option>
            </select>
            <br><br>
            </label>
            <label>Cache Hit Time (cycles): <br> <input type="number" id="hitTime" value="1"></label>
            <br><br>
            <label>Miss Penalty per Word (cycles): <br> <input type="number" id="missPenaltyPerWord" value="10"></label>
            <br><br>
            <label> Test Cases <br>
                <select id="testCases">
                        <option value="sequential">Sequential Sequence</option>
                        <option value="mid-repeat">Mid-Repeat Sequence</option>
                        <option value="random">Random Sequence</option>
                </select>
            </label>
            <br><br>
            <label> View Mode <br>
                <select id="viewMode">
                        <option value="final">Final Snapshot Only</option>
                        <option value="animated">Step-by-Step Animated</option>
                </select>
            </label>

            <div class="Output">
                <! this is where the visual and statistical output will be placed !>
            </div>


        </div>
    </section>

</body>
</html>

        <!-- this is the test js right now, change it if it's wrong -->
        <script>
            const NUM_WAYS = 4;
            const MEM_BLOCKS = 1024;
            // removed the fixed HIT_TIME / MEM_PER_WORD constants, they now come from the input fields so the user can adjust them in the UI

        function isPowerOfTwo(n) {
            return Number.isInteger(n) && n > 0 && (n & (n - 1)) === 0;
        }

        // fixed seed so the random test case gives the same sequence every time it's run with the same settings
        const RANDOM_SEED = 42;

        // small seeded random number generator (mulberry32), returns a function that gives numbers between 0 and 1
        // this replaces Math.random() so results are reproducible instead of different on every run
        function createRng(seed) {
            let state = seed >>> 0;
            return function () {
                state |= 0;
                state = (state + 0x6D2B79F5) | 0;
                let t = Math.imul(state ^ (state >>> 15), 1 | state);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function generateSequence(testCase, n, input) {
            const seq = [];

            // if the user typed a custom Base Sequence Pool, use those block numbers instead of plain 0,1,2,3...
            // it just cycles through the pool in order, wrapping back to the start once it runs out
            const getBlock = (index) => {
                if (input && input.length > 0) {
                    return input[index % input.length];
                }
                return index;
            };

            if (testCase === 'sequential') {
                const base = [];
                for (let i = 0; i < 2 * n; i++) base.push(getBlock(i));
                seq.push(...base, ...base);

            } else if (testCase === 'mid-repeat') {
                // based on the example in the spec (n=4): 0,1,2,3, 0,1,2,3,4,5,6,7, 0,1,2,3,4,5,6,7,
                // 3,2,1,0, 7,6,5,4,3,2,1,0, 7,6,5,4,3,2,1,0 -- basically count up then count back down
                const ascendingPartial = [];
                for (let i = 0; i < n; i++) ascendingPartial.push(getBlock(i));

                const ascendingFull = [];
                for (let i = 0; i < 2 * n; i++) ascendingFull.push(getBlock(i));

                const descendingPartial = ascendingPartial.slice().reverse();
                const descendingFull = ascendingFull.slice().reverse();

                seq.push(
                    ...ascendingPartial,
                    ...ascendingFull,
                    ...ascendingFull,
                    ...descendingPartial,
                    ...descendingFull,
                    ...descendingFull
                );

            } else if (testCase === 'random') {
                const rng = createRng(RANDOM_SEED);
                for (let i = 0; i < 64; i++) {
                    if (input && input.length > 0) {
                        seq.push(input[Math.floor(rng() * input.length)]);
                    } else {
                        seq.push(Math.floor(rng() * MEM_BLOCKS));
                    }
            }
        }

        return seq;

        }

        function createCache(numSets) {
            const sets = [];
            for (let s = 0; s < numSets; s++) {
                const ways = [];
                for (let w = 0; w < NUM_WAYS; w++) {
                    ways.push({ valid: false, tag: null, lastUsed: -1 ,block: null});
                }
                sets.push(ways);
        }
        return sets;
    }

    function runSimulation(policyType, numSets, sequence) {
            const cache = createCache(numSets);
            let hits = 0;
            let misses = 0;
            const simLog =[];
            // a copy of the whole cache after every access, used to play back the simulation step by step
            const stepSnapshots = [];

            sequence.forEach((blockAddr, step) => {
                const setIndex = blockAddr % numSets;
                const tag = Math.floor(blockAddr / numSets);
                const set = cache[setIndex];
                const hitWay = set.find(w => w.valid && w.tag === tag);
                let actLog = "";

                if (hitWay) {
                    hits++;
                    hitWay.lastUsed = step;
                    actLog = 'Hit in set ' + setIndex;
                } else {
                    misses++;
                    let targetWay = set.find(w => !w.valid);

                    if (!targetWay) {
                        if (policyType === 'LRU') {
                            targetWay = set.reduce((min, w) => w.lastUsed < min.lastUsed ? w : min, set[0]);
                        } else {
                            targetWay = set.reduce((max, w) => w.lastUsed > max.lastUsed ? w : max, set[0]);
                        }
                    actLog = 'MISS (Evicted Block ' + targetWay.block + ' from Set ' + setIndex + ')';
                    } else {
                        actLog = 'MISS (Placed in empty slot in Set ' + setIndex + ')';
                    }

                    targetWay.valid = true;
                    targetWay.tag = tag;
                    targetWay.lastUsed = step;
                    targetWay.block = blockAddr;
                }
                simLog.push('Step ' + (step + 1) + ': Access Block ' + blockAddr + ' -> ' + actLog);
                stepSnapshots.push(JSON.parse(JSON.stringify(cache)));
            });

            return { hits, misses, total: sequence.length, finalCache: cache, simLog, stepSnapshots };
        }

        // subtitle defaults to "Final Memory Snapshot" but during animated playback we pass in "Step X of N" instead
        function cachTable(cache, title, subtitle) {
            subtitle = subtitle || 'Final Memory Snapshot';
            let html = '<h4>' + title + ' - ' + subtitle + '</h4>';
            html += `<table style="width:100%; border-collapse: collapse; margin-bottom: 20px; font-size:11px;" border="1">`;
            html += `<tr><th>Set Index</th><th>Way 0</th><th>Way 1</th><th>Way 2</th><th>Way 3</th></tr>`;
            cache.forEach((set, i) => {
                // figure out which way in this set was used longest ago (LRU) and most recently (MRU),
                // so we can mark them in the grid
                const validWays = set.filter(w => w.valid);
                const oldestWay = validWays.length ? validWays.reduce((min, w) => w.lastUsed < min.lastUsed ? w : min, validWays[0]) : null;
                const newestWay = validWays.length ? validWays.reduce((max, w) => w.lastUsed > max.lastUsed ? w : max, validWays[0]) : null;

                html += `<tr><td>${i}</td>`;
                set.forEach(way => {
                    if (!way.valid) {
                        html += `<td>Empty<br>Valid: 0</td>`;
                    } else {
                        let marker = '';
                        if (way === oldestWay) marker += ' <span style="color:#ff8888;">[LRU]</span>';
                        if (way === newestWay) marker += ' <span style="color:#88ff88;">[MRU]</span>';
                        html += `<td>Blk ${way.block}<br>Valid: 1, Tag: ${way.tag}${marker}</td>`;
                    }
                });
                html += `</tr>`;
            });
            html += `</table>`;
            return html;
        }

        // note: the 2nd param should be hit cost, and the 3rd param should be miss cost
        // these were swapped before, which is why the amat/total time came out wrong
        function statOutput(res, hit, missPen) {
            let hitRate = (res.hits / res.total);
            let missRate = (res.misses / res.total);
            let totalAccessTime = (Number(res.hits) * Number(hit)) + (Number(res.misses) * Number(missPen));
            let amat = totalAccessTime / res.total;

            return {
                hitRate: (hitRate * 100).toFixed(2),
                missRate: (missRate * 100).toFixed(2),
                totalTime: totalAccessTime,
                amat: amat.toFixed(2)
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            const configDiv = document.querySelector('.config');
            let outputDiv = document.querySelector('.Output') || document.querySelector('#output');

            const testCasesLabel = document.getElementById('testCases').parentNode;
            const baseSeqLabel = document.createElement('label');
            baseSeqLabel.innerHTML = 'Base Sequence Pool: <br> <input type="text" id="baseSequence" placeholder="e.g. 10, 20, 30, 40">';
            baseSeqLabel.style.display = 'block';
            baseSeqLabel.style.marginBottom = '15px';
            
            const baseSeqInput = baseSeqLabel.querySelector('input');
            baseSeqInput.style.border = '3px solid #555555';
            baseSeqInput.style.borderRadius = '12px';
            baseSeqInput.style.width = '200px';
            baseSeqInput.style.padding = '6px 7px';
            baseSeqInput.style.outline = 'none';
            baseSeqInput.style.backgroundColor = '#ffffff';
            baseSeqInput.style.boxSizing = 'border-box';
            baseSeqInput.style.textAlign = 'center';
            baseSeqInput.style.fontSize = '14px';
            baseSeqInput.style.fontFamily = 'Helvetica, sans-serif';
            baseSeqInput.style.transition = 'border-color 0.2s ease, box-shadow 0.2s';

            testCasesLabel.parentNode.insertBefore(baseSeqLabel, testCasesLabel);

            // holds the setInterval id for the step-by-step animation, so we can stop a running one if Run is clicked again
            let animTimer = null;

            let runBtn = document.getElementById('runBtn');
            if (!runBtn) {
                runBtn = document.createElement('button');
                runBtn.id = 'runBtn';
                runBtn.innerText = 'Run Simulation';
                configDiv.insertBefore(runBtn, outputDiv);
            }

            runBtn.addEventListener('click', () => {
                if (animTimer) {
                    clearInterval(animTimer);
                    animTimer = null;
                }

                const blockSize = parseInt(document.getElementById('blockSize').value, 10);
                const cacheBlocks = parseInt(document.getElementById('cacheBlocks').value, 10);
                const hitTime = parseInt(document.getElementById('hitTime').value, 10);
                const missPenaltyPerWord = parseInt(document.getElementById('missPenaltyPerWord').value, 10);
                const testCase = document.getElementById('testCases').value;
                const viewMode = document.getElementById('viewMode').value;
                const policy = document.getElementById('policy').value;
                const rawInput = document.getElementById('baseSequence').value;

                if (isNaN(blockSize) || !isPowerOfTwo(blockSize) || blockSize < 2) {
                    outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Block Size must be a power of 2 and at least 2.</p>`;
                    return;
                }
                if (isNaN(cacheBlocks) || !isPowerOfTwo(cacheBlocks) || cacheBlocks < 4) {
                    outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Cache Blocks must be a power of 2 and at least 4.</p>`;
                    return;
                }
                if (isNaN(hitTime) || hitTime < 0 || isNaN(missPenaltyPerWord) || missPenaltyPerWord < 0) {
                    outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Hit Time and Miss Penalty per Word must be non-negative numbers.</p>`;
                    return;
                }

                // the sequence values here are already block numbers (0 to MEM_BLOCKS-1), not word addresses,
                // so blockSize is not used to split them into tag/set/offset. it's only used to work out
                // how big main memory is in words (totalWords) for capacity info and to validate the
                // custom block numbers the user enters in the Base Sequence Pool
                const totalWords = MEM_BLOCKS * blockSize;

                let inputBlock = [];
                if (rawInput.trim() !== '') {
                    inputBlock = rawInput.split(',').map(s => parseInt(s.trim(), 10)).filter(num => !isNaN(num));
                    if (inputBlock.length === 0) {
                        outputDiv.innerHTML = `<p style="color: #ff8888;">Please Separate Numbers with a comma</p>`;
                        return;
                    }
                    const outOfRange = inputBlock.find(b => b < 0 || b >= MEM_BLOCKS);
                    if (outOfRange !== undefined) {
                        outputDiv.innerHTML = `<p style="color: #ff8888;">Error: Block ${outOfRange} is out of range. Valid blocks are 0 to ${MEM_BLOCKS - 1} (Main Memory has ${totalWords} words total at ${blockSize} words/block).</p>`;
                        return;
                    }
                }

                // load-through: don't wait for the whole block, only the word that's needed
                // non-load-through: need to wait for the whole block before it can be accessed, so this is much higher, especially when the block size is large
                let missPenalty = 0;
                if (policy === 'Non-load-through') {
                    missPenalty = hitTime + (blockSize * missPenaltyPerWord);
                } else {
                    missPenalty = hitTime + missPenaltyPerWord;
                }

                const numSets = cacheBlocks / NUM_WAYS;
                const sequence = generateSequence(testCase, cacheBlocks, inputBlock);

                const lruRes = runSimulation('LRU', numSets, sequence);
                const mruRes = runSimulation('MRU', numSets, sequence);

                // (result, cost per hit, cost per miss) -- these were swapped before
                const lruStats = statOutput(lruRes, hitTime, missPenalty);
                const mruStats = statOutput(mruRes, hitTime, missPenalty);

                let outHtml = '<div style="margin-top:20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;">';
                outHtml += '<h3>Statistical Outputs (' + sequence.length + ' Accesses)</h3>';
                outHtml += '<p style="font-size:12px; font-weight:normal;">Miss Penalty calculated at ' + missPenalty + ' cycles.</p>';
                outHtml += '<p style="font-size:12px; font-weight:normal;">Main Memory Capacity: ' + MEM_BLOCKS + ' blocks &times; ' + blockSize + ' words/block = ' + totalWords + ' words total.</p>';

                outHtml += '<table style="width:100%; color:white; text-align:center; border-collapse: collapse; margin-bottom: 20px;" border="1">';
                outHtml += '<tr><th>Metric</th><th>LRU</th><th>MRU</th></tr>';
                outHtml += '<tr><td>Total Accesses</td><td>' + lruRes.total + '</td><td>' + mruRes.total + '</td></tr>';
                outHtml += '<tr><td>Hits</td><td>' + lruRes.hits + '</td><td>' + mruRes.hits + '</td></tr>';
                outHtml += '<tr><td>Misses</td><td>' + lruRes.misses + '</td><td>' + mruRes.misses + '</td></tr>';
                outHtml += '<tr><td>Hit Rate</td><td>' + lruStats.hitRate + '%</td><td>' + mruStats.hitRate + '%</td></tr>';
                outHtml += '<tr><td>Miss Rate</td><td>' + lruStats.missRate + '%</td><td>' + mruStats.missRate + '%</td></tr>';
                outHtml += '<tr><td>Total Access Time</td><td>' + lruStats.totalTime + ' cycles</td><td>' + mruStats.totalTime + ' cycles</td></tr>';
                outHtml += '<tr><td>AMAT</td><td>' + lruStats.amat + ' cycles</td><td>' + mruStats.amat + ' cycles</td></tr>';
                outHtml += '</table>';

                if (viewMode === 'final') {
                    // just show the end result, no playback
                    outHtml += '<div style="display: flex; justify-content: space-between; gap: 10px;">';
                    outHtml += '<div style="flex: 1;">' + cachTable(lruRes.finalCache, 'LRU') + '</div>';
                    outHtml += '<div style="flex: 1;">' + cachTable(mruRes.finalCache, 'MRU') + '</div>';
                    outHtml += '</div>';

                    outHtml += '<h3>System Output Trace Log</h3>';
                    outHtml += '<div style="display: flex; justify-content: space-between; gap: 10px;">';

                    outHtml += '<div style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;">';
                    outHtml += '<strong>LRU Trace:</strong><br>' + lruRes.simLog.join('<br>');
                    outHtml += '</div>';

                    outHtml += '<div style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;">';
                    outHtml += '<strong>MRU Trace:</strong><br>' + mruRes.simLog.join('<br>');
                    outHtml += '</div>';
                    outHtml += '</div></div>';

                    outputDiv.innerHTML = outHtml;
                } else {
                    // step-by-step animated: leave empty containers here, then fill them in one access at a time below
                    outHtml += '<div id="animGrids" style="display: flex; justify-content: space-between; gap: 10px;"></div>';
                    outHtml += '<p id="animStepLabel" style="font-size:12px; font-weight:normal;"></p>';

                    outHtml += '<h3>System Output Trace Log</h3>';
                    outHtml += '<div style="display: flex; justify-content: space-between; gap: 10px;">';
                    outHtml += '<div id="animLruLog" style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;"><strong>LRU Trace:</strong><br></div>';
                    outHtml += '<div id="animMruLog" style="flex: 1; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border: 1px solid #555; text-align: left; font-size: 12px; font-weight: normal; font-family: monospace;"><strong>MRU Trace:</strong><br></div>';
                    outHtml += '</div></div>';

                    outputDiv.innerHTML = outHtml;

                    const gridsDiv = document.getElementById('animGrids');
                    const stepLabel = document.getElementById('animStepLabel');
                    const lruLogDiv = document.getElementById('animLruLog');
                    const mruLogDiv = document.getElementById('animMruLog');
                    const totalSteps = sequence.length;
                    const ANIM_DELAY_MS = 300;
                    let step = 0;

                    animTimer = setInterval(() => {
                        const stepText = 'Step ' + (step + 1) + ' of ' + totalSteps;
                        gridsDiv.innerHTML =
                            '<div style="flex: 1;">' + cachTable(lruRes.stepSnapshots[step], 'LRU', stepText) + '</div>' +
                            '<div style="flex: 1;">' + cachTable(mruRes.stepSnapshots[step], 'MRU', stepText) + '</div>';
                        stepLabel.innerText = stepText;

                        lruLogDiv.innerHTML += lruRes.simLog[step] + '<br>';
                        mruLogDiv.innerHTML += mruRes.simLog[step] + '<br>';
                        lruLogDiv.scrollTop = lruLogDiv.scrollHeight;
                        mruLogDiv.scrollTop = mruLogDiv.scrollHeight;

                        step++;
                        if (step >= totalSteps) {
                            clearInterval(animTimer);
                            animTimer = null;
                        }
                    }, ANIM_DELAY_MS);
                }
            });
        });
    </script>
</body>
</html>
